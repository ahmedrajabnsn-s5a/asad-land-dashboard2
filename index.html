<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asad Land Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0a0d1f;--p1:#141a3a;--p2:#1c2350;--tx:#eef1ff;--mu:#9aa3d4;--ok:#19e3b1;--wa:#ffb020;--pk:#ff4fa3;--vi:#7c5cff;--ln:#2b3470;--tb:#0a0d1fe8;--mb:#070a18;--gl:#ffffff06;--fr:#1a1530;--tk:#2b3470;--g1:#2a1b6e55;--g2:#00c9a722;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html[data-theme=light]{--bg:#f2f4ff;--p1:#ffffff;--p2:#eaeeff;--tx:#141a3a;--mu:#586092;--ln:#cdd5f4;--ok:#00957a;--wa:#b86e00;--tb:#f2f4ffee;--mb:#fbfcff;--gl:#14183a0d;--fr:#fff6e0;--tk:#d5dbf5;--g1:#7c5cff26;--g2:#19e3b133;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,var(--g1),transparent),radial-gradient(900px 500px at 100% 0,var(--g2),transparent),var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif}
h1,h2,.big{font-family:Sora,system-ui,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:clamp(22px,3.4vw,38px);font-weight:800;background:linear-gradient(90deg,#fff,var(--ok) 45%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--mu)}
button,select{font:inherit;color:var(--tx)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--p2);border:1px solid var(--ln)}
.btn.g{background:linear-gradient(135deg,var(--ok),#00a8ff);color:#04112b;border:0}
.btn.v{background:linear-gradient(135deg,var(--vi),var(--pk));border:0}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k{border-radius:18px;padding:16px;background:linear-gradient(145deg,var(--p2),var(--p1));border:1px solid var(--ln);position:relative;overflow:hidden}
.k:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}
.k .big{font-size:clamp(24px,3vw,34px);font-weight:800;color:var(--c)}
.k span{color:var(--mu)}
.row{display:grid;grid-template-columns:minmax(260px,1fr) 2fr 1.3fr;gap:12px;margin:12px 0}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
.pan{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--ln);border-radius:18px;padding:16px}
.pan h2{margin:0 0 10px;font-size:16px}
.donut{display:flex;gap:16px;align-items:center}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring b{width:92px;height:92px;border-radius:50%;background:var(--p1);display:grid;place-items:center;font:800 22px Sora}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;cursor:pointer;background:none;border:0;text-align:left;padding:2px}
.bar i{height:12px;border-radius:8px;display:block}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ins{margin:0;padding-left:18px;color:var(--mu)} .ins li{margin-bottom:6px} .ins b{color:var(--tx)}
.tools{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--tb);backdrop-filter:blur(8px);padding:10px;border:1px solid var(--ln);border-radius:16px;margin-bottom:10px}
.dd{position:relative}
.dd>button,.tools select{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;cursor:pointer;min-width:170px;text-align:left}
.menu{display:none;position:absolute;top:110%;left:0;width:300px;max-height:380px;overflow:auto;background:var(--p1);border:1px solid var(--vi);border-radius:14px;padding:8px;z-index:30;box-shadow:0 20px 50px #000a}
.dd.open .menu{display:block}
.menu input[type=search],dialog input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
.menu label{display:flex;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.menu label:hover{background:var(--p2)} .menu em{margin-left:auto;color:var(--mu);font-style:normal;font-size:12px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--ln);background:var(--p2);border-radius:20px;padding:7px 12px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--vi),var(--pk));border-color:transparent}
.mapbox{overflow-x:auto;border-radius:18px;border:1px solid var(--ln);background:repeating-linear-gradient(0deg,var(--gl) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,var(--gl) 0 1px,transparent 1px 40px),var(--mb)}
#map{position:relative;margin:14px}
.card{position:absolute;border-radius:6px;padding:3px 4px;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center;line-height:1.15;border:1px solid #ffffff55;transition:opacity .2s,transform .15s}
.card:hover{transform:scale(1.06);z-index:5}
.card b{font-family:Sora;font-weight:800}
.card .n{font-weight:700;word-break:break-word}
.card i{font-style:normal;opacity:.9}
.card.free{background:var(--fr);border:1.5px dashed var(--wa);color:var(--wa)}
.card.free u{text-decoration:none;color:var(--fr);background:var(--wa);border-radius:6px;font-weight:800;margin-top:2px;padding:1px 2px}
.card.dim{opacity:.1}
dialog{border:1px solid var(--vi);background:var(--p1);color:var(--tx);border-radius:18px;padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#000b}
dialog h2{margin:0 0 4px} dialog p{color:var(--mu);margin:0 0 12px}
dialog .a{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.mut{color:var(--mu)}.fl{display:block;margin-top:8px;color:var(--mu);font-size:12px}.fl input{margin-top:3px}#det{display:grid;gap:6px;margin:0 0 10px}.dr{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--ln)}.dr span{color:var(--mu)}.dr b{text-align:right}.dr a{color:var(--ok);font-weight:700;text-decoration:none}dialog{max-height:92vh;overflow:auto}
</style></head><body><div class="wrap">
<header><div><h1>Asad Land Tracker</h1><p>Plots, owners and live distribution map. <span id="edc"></span></p></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="th" aria-label="Toggle light or dark theme">Light mode</button><button class="btn" id="ip">Import Excel</button><input type="file" id="imp" accept=".xlsx,.xls,.csv" hidden><button class="btn g" id="xl">Export Excel</button><button class="btn v" id="png">Export Map PNG</button><button class="btn" id="rs">Reset edits</button></div></header>
<section class="kpis" id="kpis"></section>
<section class="row">
<div class="pan"><h2>Land assigned</h2><div class="donut"><div class="ring" id="ring"><b id="pct"></b></div><div class="mut" id="dl"></div></div></div>
<div class="pan"><h2>Top owners by area (click to filter)</h2><div class="bars" id="bars"></div></div>
<div class="pan"><h2>Smart insights</h2><ul class="ins" id="ins"></ul></div>
</section>
<div class="tools">
<div class="dd" id="dd"><button id="ddb" aria-haspopup="true">All owners</button><div class="menu"><input type="search" id="q" placeholder="Search short name"><div style="display:flex;gap:6px;margin:6px 0"><button class="chip" id="sa">Select all</button><button class="chip" id="ca">Clear</button></div><div id="ol"></div></div></div>
<select id="ab" aria-label="Area"></select>
<div class="chips" id="st"></div>
<button class="chip on" id="fit">Fit to width</button><label class="mut">Zoom <input type="range" id="zm" min="3" max="20" step="0.5" value="9"></label>
<span class="mut" id="shown"></span>
</div>
<div class="mapbox"><div id="map"></div></div>
</div>
<dialog id="dlg"><h2 id="dt"></h2><p id="ds"></p><div id="det"></div><label class="fl">Owner short name<input id="nm" list="names" placeholder="Owner short name" autocomplete="off"></label><datalist id="names"></datalist><label class="fl">Owner phone<input id="ph" inputmode="tel"></label><label class="fl">Broker<input id="br"></label><label class="fl">Broker phone<input id="bp" inputmode="tel"></label><div class="a"><button class="btn" id="rm">Remove name</button><button class="btn" id="cx">Cancel</button><button class="btn g" id="sv">Save</button></div></dialog>

function applyAll(){D.forEach(r=>{Object.assign(r,base[r.no],ed[r.no]);r.status=r.short?'Dedicated':'Not Dedicated'})}
applyAll();
const $=id=>document.getElementById(id),f0=n=>Math.round(n).toLocaleString('en');
const BINS=[['all','All areas',0,1e9],['lt200','Under 200 m²',0,200],['b1','200 – 210 m²',200,210],['b2','210 – 225 m²',210,225],['b3','225 – 300 m²',225,300],['b4','300 m² and above',300,1e9],['na','No area yet',-1,-1]];
let sel=new Set(),bin='all',stt='all',z=9,fit=true;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const col=s=>`hsl(${hue(s)} 70% 40%)`;
const persist=()=>{if(DB)return;try{localStorage.setItem(LS,JSON.stringify(ed))}catch(e){}};
function owners(){const m={};D.forEach(r=>{if(!r.short)return;const o=m[r.short]||(m[r.short]={s:r.short,n:r.name,p:0,a:0});o.p++;o.a+=r.area||0});return Object.values(m).sort((a,b)=>b.p-a.p||b.a-a.a)}
function match(r){if(sel.size&&!(r.short?sel.has(r.short):sel.has('__none')))return false;
 if(stt=='ded'&&!r.short||stt=='not'&&r.short)return false;
 if(bin!='all'){const b=BINS.find(x=>x[0]==bin);if(bin=='na')return r.area==null;if(r.area==null||r.area<b[2]||r.area>=b[3])return false}return true}
function summary(){const O=owners(),ded=D.filter(r=>r.short),fr=D.filter(r=>!r.short);
 const A=a=>a.reduce((s,r)=>s+(r.area||0),0),ta=A(D),da=A(ded),pc=Math.round(ded.length/D.length*100);
 const K=[['Total plots',D.length,'var(--vi)','on map'],['Assigned',ded.length,'var(--ok)',pc+'% of plots'],['Waiting for a name',fr.length,'var(--wa)','add owner on map'],['Owners',O.length,'var(--pk)','distinct short names'],['Assigned area',f0(da)+' m²','var(--ok)',f0(da/ta*100*100/100)+'% of '+f0(ta)+' m²']];
 $('kpis').innerHTML=K.map(k=>`<div class="k" style="--c:${k[2]}"><div class="big">${k[1]}</div><b>${k[0]}</b><br><span>${k[3]}</span></div>`).join('');
 $('ring').style.background=`conic-gradient(var(--ok) ${pc*3.6}deg,var(--tk) 0)`;$('pct').textContent=pc+'%';
 $('dl').innerHTML=`<b style="color:var(--ok)">${ded.length}</b> assigned<br><b style="color:var(--wa)">${fr.length}</b> open`;
 const mx=O[0]?Math.max(...O.map(o=>o.a)):1;const T=[...O].sort((a,b)=>b.a-a.a).slice(0,8);
 $('bars').innerHTML=T.map(o=>`<button class="bar" data-o="${o.s}"><span>${o.s}</span><i style="width:${o.a/mx*100}%;background:linear-gradient(90deg,${col(o.s)},var(--ok))"></i><span>${f0(o.a)}</span></button>`).join('');
 const big=[...fr].filter(r=>r.area).sort((a,b)=>b.area-a.area)[0],top=O[0];
 $('ins').innerHTML=`<li><b>${top?top.s:'-'}</b> holds the most plots (${top?top.p:0}, ${top?f0(top.a):0} m²).</li><li><b>${fr.length}</b> plots still need an owner, worth <b>${f0(A(fr))} m²</b>.</li>${big?`<li>Largest open plot: <b>${big.no}</b> (${f0(big.area)} m²).</li>`:''}<li><b>${O.filter(o=>o.p>1).length}</b> owners hold more than one plot.</li>`;
 $('names').innerHTML=O.map(o=>`<option value="${o.s}">`).join('');return O}
function menu(){const O=owners(),q=$('q').value.toLowerCase(),nf=D.filter(r=>!r.short).length;
 const L=[['__none','Not assigned (open)',nf],...O.map(o=>[o.s,o.s,o.p])].filter(x=>x[1].toLowerCase().includes(q));
 $('ol').innerHTML=L.map(x=>`<label><input type="checkbox" value="${x[0]}" ${sel.has(x[0])?'checked':''}>${x[1]}<em>${x[2]}</em></label>`).join('');
 $('ddb').textContent=sel.size?sel.size+' owner'+(sel.size>1?'s':'')+' selected':'All owners'}
const minx=Math.min(...D.map(r=>r.x)),miny=Math.min(...D.map(r=>r.y)),W=Math.max(...D.map(r=>r.x+r.w))-minx,H=Math.max(...D.map(r=>r.y+r.h))-miny;
const fitZ=()=>Math.max(4,Math.min(20,Math.floor(($('map').parentNode.clientWidth-32)/W*10)/10));
function draw(){const m=$('map');if(fit){z=fitZ();$('zm').value=z}$('fit').classList.toggle('on',fit);m.style.width=W*z+'px';m.style.height=H*z+'px';let n=0;
 const fs=Math.max(7,Math.min(14,z*1.1));
 m.innerHTML=D.map((r,i)=>{const ok=match(r);if(ok)n++;
  const st=`left:${(r.x-minx)*z}px;top:${(r.y-miny)*z}px;width:${r.w*z-2}px;height:${r.h*z-2}px;font-size:${fs}px`;
  const ar=r.area!=null?f0(r.area)+' m²':'';
  return r.short?`<div class="card${ok?'':' dim'}" tabindex="0" data-i="${i}" style="${st};background:linear-gradient(145deg,${col(r.short)},hsl(${(hue(r.short)+40)%360} 75% 28%))" title="${r.no} ${r.name||''} ${r.W||''}×${r.L||''}"><b>${r.no}</b><span class="n">${r.short}</span><i>${ar}</i></div>`
  :`<div class="card free${ok?'':' dim'}" tabindex="0" data-i="${i}" style="${st}" title="${r.no} open ${r.W||''}×${r.L||''}"><b>${r.no}</b><i>${ar}</i><u>+ Add name</u></div>`}).join('');
 $('shown').textContent=`Showing ${n} of ${D.length} plots`;$('edc').textContent=(DB?'Shared live: everyone sees the same names. ':'Saved on this device only (sign in to share). ')+(Object.keys(ed).length?Object.keys(ed).length+' names added.':'')}
function all(){summary();menu();draw()}
$('ab').innerHTML=BINS.map(b=>`<option value="${b[0]}">${b[1]}</option>`).join('');
$('st').innerHTML=[['all','All'],['ded','Assigned'],['not','Open']].map(s=>`<button class="chip${s[0]=='all'?' on':''}" data-s="${s[0]}">${s[1]}</button>`).join('');
$('ddb').onclick=e=>{e.stopPropagation();$('dd').classList.toggle('open')};
document.addEventListener('click',e=>{if(!$('dd').contains(e.target))$('dd').classList.remove('open')});
$('q').oninput=menu;
$('ol').onchange=e=>{e.target.checked?sel.add(e.target.value):sel.delete(e.target.value);menu();draw()};
$('sa').onclick=()=>{[...document.querySelectorAll('#ol input')].forEach(c=>sel.add(c.value));menu();draw()};
$('ca').onclick=()=>{sel.clear();menu();draw()};
$('ab').onchange=e=>{bin=e.target.value;draw()};
$('st').onclick=e=>{const s=e.target.dataset.s;if(!s)return;stt=s;[...$('st').children].forEach(c=>c.classList.toggle('on',c.dataset.s==s));draw()};
$('zm').oninput=e=>{fit=false;z=+e.target.value;draw()};
$('fit').onclick=()=>{fit=true;draw()};
let rt;addEventListener('resize',()=>{if(!fit)return;cancelAnimationFrame(rt);rt=requestAnimationFrame(draw)});
$('bars').onclick=e=>{const b=e.target.closest('.bar');if(!b)return;const o=b.dataset.o;sel.has(o)?sel.delete(o):sel.add(o);menu();draw()};
let cur=null;
const tel=v=>v?`<a href="tel:${v}">${v}</a>`:'<span>-</span>';
const open=i=>{cur=D[i];const r=cur;$('dt').textContent='Plot '+r.no+(r.short?' · '+r.short:'');$('ds').textContent=r.short?'Assigned land':'Open land, add an owner below';
 const R=[['Full name',r.name],['Size',(r.W||'?')+' × '+(r.L||'?')+' m'],['Area',r.area!=null?f0(r.area)+' m²':null],['Status',r.status],['Owner phone',r.phone?tel(r.phone):null],['Broker',r.broker],['Broker phone',r.bphone?tel(r.bphone):null]];
 $('det').innerHTML=R.map(x=>`<div class="dr"><span>${x[0]}</span><b>${x[1]||'<span>-</span>'}</b></div>`).join('');
 $('nm').value=r.short||'';$('ph').value=r.phone||'';$('br').value=r.broker||'';$('bp').value=r.bphone||'';$('rm').style.display=r.short?'':'none';$('dlg').showModal()};
$('map').onclick=e=>{const c=e.target.closest('.card');if(c)open(+c.dataset.i)};
$('map').onkeydown=e=>{if(e.key=='Enter'&&e.target.dataset.i)open(+e.target.dataset.i)};
const dbw=no=>{if(!DB)return;const p=DB.doc('edits/'+no);(ed[no]?p.set({...ed[no],t:Date.now()}):p.delete()).catch(()=>{$('edc').textContent='Could not save to the cloud (you may have view-only access)'})};
function setName(v){const r=cur;v=(v||'').trim();const g=k=>$(k).value.trim()||null;
 if(v){const ex=D.find(x=>x!==r&&x.short&&x.short.toLowerCase()==v.toLowerCase());if(ex)v=ex.short;
  r.short=v;r.name=r.name||(ex?ex.name:v);r.phone=g('ph')||(ex?ex.phone:null);r.broker=g('br')||(ex?ex.broker:null);r.bphone=g('bp')||(ex?ex.bphone:null);r.status='Dedicated'}
 else{r.short=r.name=r.phone=r.broker=r.bphone=null;r.status='Not Dedicated'}
 const b=base[r.no],k=['short','name','phone','broker','bphone'];
 if(k.every(x=>(b[x]||null)==(r[x]||null)))delete ed[r.no];else ed[r.no]=Object.fromEntries(k.map(x=>[x,r[x]]));
 persist();dbw(r.no);$('dlg').close();all()}
$('sv').onclick=()=>setName($('nm').value);$('rm').onclick=()=>setName('');$('cx').onclick=()=>$('dlg').close();
$('nm').onkeydown=e=>{if(e.key=='Enter')setName($('nm').value)};
$('rs').onclick=()=>{if(!confirm(DB?'Remove ALL names added in the dashboard, for everyone?':'Remove all names you added?'))return;if(DB){Object.keys(ed).forEach(k=>DB.doc('edits/'+k).delete().catch(()=>{}))}else{ed={};persist();applyAll();all()}};
const LT='asad_theme';let th='dark';try{th=localStorage.getItem(LT)||'dark'}catch(e){}
const setTh=v=>{th=v;document.documentElement.dataset.theme=v;$('th').textContent=v=='light'?'Dark mode':'Light mode';try{localStorage.setItem(LT,v)}catch(e){}};
$('th').onclick=()=>setTh(th=='light'?'dark':'light');setTh(th);
$('ip').onclick=()=>$('imp').click();
$('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets['Data']||wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
  if(!rows.length||!('No.' in rows[0])){alert('This file has no "No." column. Please upload the file exported from this dashboard.');return}
  const g=(o,k)=>{const v=o[k];return v==null||String(v).trim()===''?null:String(v).trim()};
  const K=['short','name','phone','broker','bphone'],ne={};let seen=0;
  rows.forEach(o=>{const no=g(o,'No.');if(!no||!base[no])return;seen++;
   const v={short:g(o,'Owner Short Name'),name:g(o,'Owner Name'),phone:g(o,'Owner Phone'),broker:g(o,'Broker'),bphone:g(o,'Broker Phone')};
   if(!v.short)K.forEach(k=>v[k]=null);
   const b=base[no];if(!K.every(k=>(b[k]||null)==(v[k]||null)))ne[no]=v});
  if(!seen){alert('No plot numbers in this file match the map.');return}
  if(!confirm('Load '+seen+' plots from "'+f.name+'"? This replaces the names currently shown.'))return;
  const old=Object.keys(ed);ed=ne;persist();applyAll();all();
  if(DB)new Set([...old,...Object.keys(ne)]).forEach(dbw);
  alert('Done. '+Object.keys(ne).length+' plots differ from the original data.')
 }catch(err){alert('Could not read this file.')}};
function save(wb,n){XLSX.writeFile(wb,n)}
$('xl').onclick=()=>{
 const hd=['No.','Area','Width','Length','Owner Name','Owner Short Name','Land Status','Owner Phone','Broker','Broker Phone','Added in dashboard'];
 const data=[hd,...D.map(r=>[r.no,r.area,r.W,r.L,r.name,r.short,r.status,r.phone,r.broker,r.bphone,ed[r.no]?'Yes':''])];
 const g=Array.from({length:H},()=>Array(W).fill(''));const mg=[];
 D.forEach(r=>{const x=r.x-minx,y=r.y-miny;g[y][x]=r.short?`${r.no}\n${r.short}\n${r.area!=null?f0(r.area)+' m²':''}`:`${r.no}\n${r.area!=null?f0(r.area)+' m²':''}\n(open)`;
  mg.push({s:{r:y,c:x},e:{r:y+r.h-1,c:x+r.w-1}})});
 const ws2=XLSX.utils.aoa_to_sheet(g);ws2['!merges']=mg;ws2['!cols']=Array(W).fill({wch:3.5});
 const O=owners(),ws3=XLSX.utils.aoa_to_sheet([['Owner','Plots','Total area m²'],...O.map(o=>[o.s,o.p,Math.round(o.a*100)/100])]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(data),'Data');XLSX.utils.book_append_sheet(wb,ws2,'Map');XLSX.utils.book_append_sheet(wb,ws3,'By Owner');save(wb,'asad_land_tracker_updated.xlsx')};
$('png').onclick=()=>{const s=12,c=document.createElement('canvas');c.width=W*s+40;c.height=H*s+40;const x=c.getContext('2d');
 x.fillStyle=th=='light'?'#fbfcff':'#070a18';x.fillRect(0,0,c.width,c.height);x.textAlign='center';x.textBaseline='middle';
 D.forEach(r=>{const l=20+(r.x-minx)*s,t=20+(r.y-miny)*s,w=r.w*s-2,h=r.h*s-2;
  if(r.short){const g=x.createLinearGradient(l,t,l+w,t+h);g.addColorStop(0,col(r.short));g.addColorStop(1,`hsl(${(hue(r.short)+40)%360} 75% 28%)`);x.fillStyle=g}else x.fillStyle=th=='light'?'#fff6e0':'#1a1530';
  x.fillRect(l,t,w,h);x.strokeStyle=r.short?'#ffffff66':'#ffb020';x.setLineDash(r.short?[]:[5,4]);x.strokeRect(l,t,w,h);
  const L=[[r.no,'800 13px Sora'],[r.short||'',' 700 11px Manrope'],[r.area!=null?f0(r.area)+' m²':'','11px Manrope']];
  x.fillStyle=r.short?'#fff':'#ffb020';L.forEach((q,i)=>{x.font=q[1];x.fillText(q[0],l+w/2,t+h/2+(i-1)*14,w-4)})});
 const a=document.createElement('a');a.download='asad_land_map.png';a.href=c.toDataURL('image/png');a.click()};
all();
(async()=>{try{const c=window.claude&&await claude.use('db');if(!c)return;DB=c;c.collection('edits').onSnapshot(s=>{ed={};s.docs.forEach(d=>ed[d.id]=d.data());applyAll();all()},()=>{})}catch(e){}})();
</script></body></html>
